name: Repository path review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      publish_sarif:
        description: Publish this manual run to GitHub code scanning (requires code scanning availability)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review declarations (completion is not safety)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANALYZER_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
      TARGET_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONNOUSERSITE: '1'
      PYTHONSAFEPATH: '1'
    steps:
      - name: Checkout trusted analyzer from the immutable base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.ANALYZER_REVISION }}
          path: trusted
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only trusted analyzer code
        working-directory: ${{ runner.temp }}
        run: python -I -m pip install --disable-pip-version-check --no-input "$GITHUB_WORKSPACE/trusted"
      - name: Checkout target revision as untrusted data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.TARGET_REVISION }}
          path: target
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Analyze source without executing target code
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -B "$GITHUB_WORKSPACE/trusted/tools/repository_ci.py"
          --repository "$GITHUB_WORKSPACE/target"
          --repository-slug "$GITHUB_REPOSITORY"
          --out "$RUNNER_TEMP/repository-review"
          --analyzer-ref "$ANALYZER_REVISION"
          --target-ref "$TARGET_REVISION"
      - name: Add the evidence-first job summary
        run: cat "$RUNNER_TEMP/repository-review/analysis.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save review reports and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-review/
          retention-days: 7
          if-no-files-found: warn

  publish-manual-sarif:
    name: Publish manually requested SARIF
    if: github.event_name == 'workflow_dispatch' && inputs.publish_sarif
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout the manual run's trusted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only this run's reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repository-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-artifacts
      - name: Publish declared-path review results
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          sarif_file: review-artifacts/analysis.sarif
          category: blast-radius-declared-repository-paths