name: Verify standard and synthetic artifacts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Install pinned project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run Python tests and coverage
        run: python -B tools/verify.py
      - name: Check JavaScript reference
        run: node reference-js/verify.mjs
      - name: Run public Python conformance
        run: blastradius conformance run --tool 'python -B -m blastradius conformance adapter' --out conformance/reports/ci-python
      - name: Run public JavaScript conformance
        run: blastradius conformance run --tool 'node reference-js/reference.mjs' --out conformance/reports/ci-javascript
      - name: Save synthetic artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: blast-radius-standard-artifacts
          path: |
            spec/
            conformance/
            research/
            reconstructions/
            results/coverage.json
            results/junit.xml
          retention-days: 14
